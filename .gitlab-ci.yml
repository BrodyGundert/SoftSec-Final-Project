# ---------------------------------------------------------------------------
# GitLab CI/CD for the CISE 330 permission-manager project.
#
# Stages, in order:
#   build    - compile with hardened WARNING FLAGS (gcc -Wall -Wextra -Werror)
#   analysis - static analysis with cppcheck (defender tooling)
#   test     - unit tests, the attacker-vs-defender demo, and fuzz testing
#   docker   - build the container image (Docker integration)
#   infra    - Terraform validate for the Infrastructure as Code
#   security - GitLab's built-in SAST + Secret Detection (as in Lab 2)
# ---------------------------------------------------------------------------
stages:
  - build
  - analysis
  - test
  - docker
  - infra
  - security

# WARNING FLAGS used across every compile job. Having them here (not just in
# the Makefile) makes them visible in the pipeline and fails the build on any
# warning. -Werror turns every warning into an error.
variables:
  WARNING_FLAGS: "-Wall -Wextra -Werror -Wshadow -Wconversion -Wformat=2"

# --- build -----------------------------------------------------------------
build:
  stage: build
  image: gcc:13
  script:
    - echo "Compiling with warning flags -> $WARNING_FLAGS"
    - make all CFLAGS="-std=c11 $WARNING_FLAGS -O1 -g -D_POSIX_C_SOURCE=200809L -fstack-protector-strong -D_FORTIFY_SOURCE=2 -fPIE"
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# --- analysis (static analysis) --------------------------------------------
# cppcheck is a C/C++ static analyzer. It must find no issues in the hardened
# code (src/), and we also run it over the vulnerable code to show it catching
# the planted bugs (informational, does not fail the pipeline).
cppcheck:
  stage: analysis
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq cppcheck
  script:
    # Gate: cppcheck must find no definite errors in the hardened code.
    # Default severity (errors only) has a very low false-positive rate.
    - echo "Static analysis gate on hardened code (src/):"
    - cppcheck --error-exitcode=1 --quiet -I src src/
    # Informational: broader checks over all C sources, never fails the build.
    - echo "Broader static analysis over all sources (informational):"
    - cppcheck --enable=warning,style,portability --inline-suppr --quiet -I src src/ vulnerable/ || true

# --- test ------------------------------------------------------------------
unit-tests:
  stage: test
  image: gcc:13
  script:
    - make test

attack-demo:
  stage: test
  image: gcc:13
  script:
    - make all
    - ./demo/attacks.sh

fuzz:
  stage: test
  image: gcc:13
  script:
    - make all
    - ./tests/fuzz.sh 1000

# --- docker ----------------------------------------------------------------
# Builds the image with Docker-in-Docker so the pipeline shows the program
# running inside a container.
docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t permctl:$CI_COMMIT_SHORT_SHA .
    - docker run --rm permctl:$CI_COMMIT_SHORT_SHA check eve delete config || true
    - docker run --rm permctl:$CI_COMMIT_SHORT_SHA demo

# --- infra (Infrastructure as Code) ----------------------------------------
# Checks the Terraform in infra/ is formatted and valid. validate needs no
# Docker daemon or cloud credentials, so it is reliable and fast.
terraform-validate:
  stage: infra
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd infra
    - terraform fmt -check -diff
    - terraform init -backend=false
    - terraform validate

# Optional: actually build the image and create the container WITH Terraform,
# inside Docker-in-Docker, to show Terraform controlling Docker in the CI logs.
# Off by default so the pipeline stays reliably green; enable by setting the
# CI/CD variable RUN_TF_APPLY=true (Settings > CI/CD > Variables), then re-run.
terraform-apply:
  stage: infra
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$RUN_TF_APPLY == "true"'
  script:
    - cd infra
    - terraform init
    - terraform apply -auto-approve
    - terraform state list
    - terraform destroy -auto-approve

# --- security --------------------------------------------------------------
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

sast:
  stage: security

secret_detection:
  stage: security
